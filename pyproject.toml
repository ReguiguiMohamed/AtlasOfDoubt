[project]
name = "atlas-of-doubt"
version = "0.1.0"
description = "Supplier concentration, disruption exposure and export structure for any country, from CEPII BACI."
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.5.6",
    "fastapi==0.143.3",
    "pymongo==4.19.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas"]

[tool.setuptools.package-data]
atlas = ["static/*", "static/views/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
