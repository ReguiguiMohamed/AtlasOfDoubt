# The public server. Caddy holds ports 80 and 443 with a Let's Encrypt certificate for ATLAS_HOST and is
# the only way in, so the app can trust the client address Caddy forwards for the report limit.
#   ATLAS_HOST=atlasofdoubt.francecentral.cloudapp.azure.com docker compose -f docker-compose.yml -f deploy/compose.yml up --build -d
# The caps add up to 3.6 of the VM's 3.8 GB, so a spike kills one container, which restarts, and never the VM.
x-logs: &logs
  logging:
    options:
      max-size: 10m
      max-file: "3"
services:
  mongo:
    command: --wiredTigerCacheSizeGB 1
    mem_limit: 1500m
    volumes:
      - ./data/snapshots/mongo-dump:/dump:ro
    restart: unless-stopped
    <<: *logs
  app:
    mem_limit: 2000m
    memswap_limit: 3000m
    # Half a core stays free for mongod, Caddy and SSH while a country builds.
    cpus: 1.5
    ports: !reset []
    environment:
      FORWARDED_ALLOW_IPS: "*"
      # Build threads would each keep their own malloc arena, which Python never hands back.
      MALLOC_ARENA_MAX: "2"
    restart: unless-stopped
    <<: *logs
  caddy:
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    command: caddy reverse-proxy --from ${ATLAS_HOST:?set ATLAS_HOST} --to app:8000
    mem_limit: 100m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data
    depends_on:
      - app
    restart: unless-stopped
    <<: *logs
volumes:
  caddy:
